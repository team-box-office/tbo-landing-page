<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Box Office — Coming Soon</title>
    <meta name="description" content="Team Box Office — ticketing built for high school sports. Coming soon." />
    <style>
      :root {
        --color-ink: #1a2332;
        --color-accent: #2240f0;
        --color-accent-hover: #1a35cc;
        --color-bg: #ffffff;
        --color-bg-soft: #f5f7fa;
        --color-muted: #5a6472;
        --color-border: #e3e8ef;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font-sans);
        color: var(--color-ink);
        background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg-soft) 100%);
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 16px;
      }
      .logo {
        width: 100%;
        max-width: 420px;
        height: auto;
        margin-bottom: 40px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      p {
        color: var(--color-muted);
        font-size: 1.125rem;
        line-height: 1.6;
        max-width: 32rem;
        margin: 0;
      }
      footer {
        border-top: 1px solid var(--color-border);
        padding: 20px 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 24px;
        font-size: 0.875rem;
        color: var(--color-muted);
      }
      footer a {
        color: var(--color-accent);
        text-decoration: none;
      }
      footer a:hover { color: var(--color-accent-hover); text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/logo.webp" alt="Team Box Office" width="2000" height="580" />
      <h1>Coming soon</h1>
      <p>Ticketing built for high school sports. We're putting the finishing touches on something new.</p>
    </main>
    <footer>
      <span>&copy; <span id="year">2026</span> Team Box Office</span>
      <a href="TBO_Privacy_Policy.pdf">Privacy Policy</a>
      <a href="TBO_Terms_of_Service.pdf">Terms of Service</a>
    </footer>
    <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  </body>
</html>
